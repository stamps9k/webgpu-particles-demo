name: Build and push image

# Variant of the shared workflow: also rebuilds when
# webgpu-particles-dist main changes (repository_dispatch sent by that
# repo's notify-site.yml), and bakes the library's current commit into
# the image via the PARTICLES_DIST_SHA build arg.
on:
  push:
    branches: [deploy-latest]
  repository_dispatch:
    types: [particles-dist-updated]
  workflow_dispatch:

# Run builds one at a time so a dispatch and a push landing together
# can't publish out of order.
concurrency:
  group: build-and-push
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # repository_dispatch runs against the default branch, so the ref
      # is pinned to deploy-latest for every trigger.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: deploy-latest

      - name: Resolve webgpu-particles-dist commit
        id: dist
        run: |
          sha=$(git ls-remote https://github.com/stamps9k/webgpu-particles-dist refs/heads/main | cut -f1)
          test -n "$sha"
          echo "Using webgpu-particles-dist $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PARTICLES_DIST_SHA=${{ steps.dist.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker push "$tag"
          done

